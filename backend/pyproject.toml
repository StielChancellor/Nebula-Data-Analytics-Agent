[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insights-navigator-backend"
version = "0.1.0"
description = "Insights Navigator V2.0 — agent swarm + Cube semantic + knowledge graph backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stiel Chancellor and contributors" }]

# Phase-0 core deps. Kept minimal so install works on any modern Python
# (we tested 3.11–3.14). Heavy GCP/LLM SDKs are behind optional extras
# below so a fresh clone doesn't fight wheel availability on bleeding-edge
# Python versions.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "networkx>=3.3",          # knowledge graph (PRD D10)
  "python-dotenv>=1.0",
  "sse-starlette>=2.1",     # SSE streaming for chat (Phase 6)
  "pyjwt[crypto]>=2.9",     # HS256 bootstrap + RS256 Firebase verify (needs cryptography)
]

[project.optional-dependencies]
# GCP runtime — install when wiring real cloud services (Phase 1+)
gcp = [
  "google-cloud-firestore>=2.16",
  "google-cloud-bigquery>=3.25",
  "google-cloud-storage>=2.18",
  "google-cloud-aiplatform>=1.60",
]
# LLM SDKs (PRD D6) — primary Gemini, fallback Claude
llm = [
  "google-genai>=0.3",
  "anthropic>=0.34",
]
# Auth + secrets (Phase 1.5 — Firebase Auth multi-tenant + Secret Manager)
# pyjwt is already in core deps (HS256 bootstrap mode); [crypto] adds RS256
# for Firebase. argon2-cffi for password hashing when we have real users.
secrets = [
  "pyjwt[crypto]>=2.9",
  "argon2-cffi>=23.1",
  "google-cloud-secret-manager>=2.20",
]
# Exports (Phase 8)
exports = [
  "openpyxl>=3.1",
]
# Dev tooling (Phase 0+)
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]
# Everything (use for full local stack)
all = [
  "insights-navigator-backend[gcp,llm,secrets,exports,dev]",
]

# Map module names → directory layout. Dashes in dir names were renamed
# to underscores so Python can import them directly.
[tool.setuptools]
package-dir = {"insnav_contracts" = "packages/contracts/insnav_contracts", "insnav_llm_router" = "packages/llm_router/insnav_llm_router", "insnav_locale" = "packages/locale/insnav_locale", "insnav_agents" = "packages/agents/insnav_agents", "insnav_graph_store" = "packages/graph_store/insnav_graph_store", "insnav_cube_client" = "packages/cube_client/insnav_cube_client", "insnav_identity" = "packages/identity/insnav_identity", "insnav_audit" = "packages/audit/insnav_audit", "insnav_verification" = "packages/verification_corpus/insnav_verification", "insnav_metric_registry" = "packages/metric_registry/insnav_metric_registry"}
packages = [
  "insnav_contracts",
  "insnav_llm_router",
  "insnav_locale",
  "insnav_agents",
  "insnav_graph_store",
  "insnav_cube_client",
  "insnav_identity",
  "insnav_audit",
  "insnav_verification",
  "insnav_metric_registry",
]

# --- Tooling ---

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
